name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ui:
    name: Desktop bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: ui
      - run: pnpm lint
        working-directory: ui
      - run: pnpm test --run
        working-directory: ui
      - run: pnpm build
        working-directory: ui

  plugin:
    name: Plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The desktop bundle is not committed. `artifacts` in pyproject tolerates its
      # absence, so the package installs without it; the tests below do not need it.
      # `ai` as well as `dev`: the Clippy dag imports @task.llm from the Common AI
      # provider, so without it that dag fails to parse and the dag tests fail with it.
      - run: pip install -e ".[dev,ai]"
      - run: ruff check src dags tests

      # Parsing a dag touches the `dag` table, so the suite needs a database even
      # though none of it is about persistence. SQLite in a temp AIRFLOW_HOME is
      # enough, and it means the dag tests really run here instead of skipping.
      - name: Create a metadata database
        run: airflow db migrate
        env:
          AIRFLOW_HOME: ${{ runner.temp }}/airflow

      - name: Tests
        run: pytest -q
        env:
          AIRFLOW_HOME: ${{ runner.temp }}/airflow

      - run: pip install build && python -m build
